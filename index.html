<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,500..900&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <title>Gym Tracker</title>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <div id="spotlight" class="spotlight"></div>
    <canvas id="dust"></canvas>
    <div class="floor"></div>
  </div>
  <div id="app">
    <header class="topbar">
      <button id="back" class="back-btn" type="button" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      </button>
      <h1 id="title" class="title"><span class="title-text">Train</span></h1>
      <div id="head-right"></div>
    </header>
    <main id="main" tabindex="-1"><div class="page"><p class="muted">Loading…</p></div></main>
    <nav class="tabbar" aria-label="Main">
      <button class="tab" data-tab="train" aria-label="Train">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg><span>Train</span>
      </button>
      <button class="tab" data-tab="history" aria-label="History">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>History</span>
      </button>
      <button class="tab" data-tab="progress" aria-label="Progress">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16"/><path d="M5 15l4.5-4.5 3.5 3L19 7"/></svg><span>Progress</span>
      </button>
      <button class="tab" data-tab="body" aria-label="Bodyweight">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M7.5 11a4.5 4.5 0 0 1 9 0"/><path d="M12 11l1.8-2.4"/></svg><span>Body</span>
      </button>
      <button class="tab" data-tab="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg><span>Settings</span>
      </button>
    </nav>
  </div>
  <noscript><p style="padding:24px;color:#f0efec">Gym Tracker needs JavaScript turned on in Safari.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
